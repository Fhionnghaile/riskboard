[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskboard"
version = "0.1.0"
description = "FAIR-style quantified risk register with a board-ready dashboard"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["flask>=3.0"]
report = ["reportlab>=4.0"]
dev = ["pytest>=8.0", "flask>=3.0", "reportlab>=4.0"]

[project.scripts]
riskboard = "riskboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
